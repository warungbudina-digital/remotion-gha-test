name: Render Remotion Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Remotion's bundled Chromium needs these libs on a stock Ubuntu runner.
      - name: Install Chromium headless deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg

      - name: Render
        run: node render.mjs

      - name: Show log
        if: always()
        run: cat out/render.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remotion-render-output
          path: out/
          retention-days: 7
